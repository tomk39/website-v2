title: Tomislav Kranjec
tagline: AI Infrastructure & Data Center Networking
description: Engineering insights on AI infrastructure, data center fabrics, EVPN/VXLAN, cloud connectivity, service provider, and enterprise networking.
url: "https://tomislavk.blog"
baseurl: ""
permalink: /:categories/:title/
timezone: Asia/Dubai
logo: /android-chrome-512x512.png
image: /assets/brand/social-card-v2.png
google_analytics: "G-5WNBNK6X00"

author:
  name: Tomislav Kranjec
  url: "https://tomislavk.blog/about/"
  description: AI infrastructure and data center networking notes, labs, and field-tested design patterns.

social:
  name: Tomislav Kranjec
  links:
    - "https://linkedin.com/in/tkranjec"
  linkedin: "https://linkedin.com/in/tkranjec"
#  x: "https://x.com/"
#  youtube: "https://www.youtube.com/"
#  github: "https://github.com/"

popular_topics:
  - title: Cisco ACI
    anchor: cisco-aci
  - title: VXLAN
    anchor: vxlan
  - title: EVPN
    anchor: evpn
#  - title: AI Fabrics
#    anchor: ai-fabrics
#  - title: Service Provider
#    anchor: service-provider
#  - title: Cloud Networking
#    anchor: cloud

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/images/topology-lab.svg
      toc: true
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/brand/social-card-v2.png
  - scope:
      path: "tools"
    values:
      image: /assets/brand/social-card-tools-v2.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - preview
  - package.json
  - package-lock.json
  - README.md
  - node_modules
  - CLAUDE.md
  - example_posts
  - scripts
  - build.sh
  - dev.sh
  - "*_old"
