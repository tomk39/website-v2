collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/images/topology-lab.svg
      toc: true
  - scope:
      path: ""
    values:
      layout: page
      image:
        path: /assets/brand/social-card-v4.jpg
        width: 1200
        height: 630
  - scope:
      path: "tools"
    values:
      image:
        path: /assets/brand/social-card-tools-v3.jpg
        width: 1200
        height: 627

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - preview
  - package.json
  - package-lock.json
  - README.md
  - node_modules
  - CLAUDE.md
  - example_posts
  - scripts
  - build.sh
  - dev.sh
  - "*_old"
