      <rect x="438" y="374" width="134" height="82" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2.3"/>
      <rect x="678" y="374" width="134" height="82" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2.3"/>
      <rect x="918" y="374" width="134" height="82" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2.3"/>
