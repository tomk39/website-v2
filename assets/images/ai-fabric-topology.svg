      <rect x="424" y="536" width="172" height="104" rx="14" fill="url(#rack)" stroke="#334155"/>
      <rect x="664" y="536" width="172" height="104" rx="14" fill="url(#rack)" stroke="#334155"/>
      <g stroke="#475569" stroke-width="1">
