        <rect x="460" y="404" width="14" height="10" rx="2"/><rect x="480" y="404" width="14" height="10" rx="2"/><rect x="500" y="404" width="14" height="10" rx="2"/><rect x="520" y="404" width="14" height="10" rx="2"/>
        <rect x="700" y="404" width="14" height="10" rx="2"/><rect x="720" y="404" width="14" height="10" rx="2"/><rect x="740" y="404" width="14" height="10" rx="2"/><rect x="760" y="404" width="14" height="10" rx="2"/>
        <rect x="940" y="404" width="14" height="10" rx="2"/><rect x="960" y="404" width="14" height="10" rx="2"/><rect x="980" y="404" width="14" height="10" rx="2"/><rect x="1000" y="404" width="14" height="10" rx="2"/>
      </g>
