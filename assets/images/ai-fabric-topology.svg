        <path d="M442 560h136M442 584h136M442 608h136"/>
        <path d="M682 560h136M682 584h136M682 608h136"/>
      </g>
      <g fill="#22c55e">
        <circle cx="216" cy="560" r="3"/><circle cx="216" cy="584" r="3"/><circle cx="216" cy="608" r="3"/>
        <circle cx="456" cy="560" r="3"/><circle cx="456" cy="584" r="3"/><circle cx="456" cy="608" r="3"/>
        <circle cx="696" cy="560" r="3"/><circle cx="696" cy="584" r="3"/><circle cx="696" cy="608" r="3"/>
      </g>
      <g fill="#38bdf8" opacity="0.8">
