        <rect x="602" y="232" width="16" height="10" rx="2"/><rect x="624" y="232" width="16" height="10" rx="2"/><rect x="646" y="232" width="16" height="10" rx="2"/>
        <rect x="838" y="232" width="16" height="10" rx="2"/><rect x="860" y="232" width="16" height="10" rx="2"/><rect x="882" y="232" width="16" height="10" rx="2"/>
