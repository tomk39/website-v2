  <g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#cbd5e1">
    <text x="132" y="700">VRF AI-FABRIC</text>
    <text x="348" y="700">EVPN / VXLAN</text>
    <text x="620" y="700">Telemetry streaming</text>
