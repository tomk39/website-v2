<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">AI infrastructure data center fabric</title>
  <desc id="desc">A realistic dark engineering illustration showing GPU compute racks connected to leaf and spine switches with EVPN VXLAN overlay paths, services, storage, and cloud edge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#13213a"/>
      <stop offset="0.48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="42%" r="62%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#2563eb" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17243a" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" x2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.5" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="820" rx="34" fill="url(#bg)"/>
  <rect width="1280" height="820" rx="34" fill="url(#glow)"/>

  <g opacity="0.22" stroke="#334155" stroke-width="1">
    <path d="M80 140h1120M80 240h1120M80 340h1120M80 440h1120M80 540h1120M80 640h1120"/>
    <path d="M160 92v640M280 92v640M400 92v640M520 92v640M640 92v640M760 92v640M880 92v640M1000 92v640M1120 92v640"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="76" y="64" fill="#f8fafc" font-size="24" font-weight="800">AI Data Center Fabric</text>
    <text x="76" y="92" fill="#94a3b8" font-size="14">GPU racks, leaf-spine switching, EVPN/VXLAN overlay, services, storage, and cloud edge</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="74" y="122" width="1132" height="604" rx="28" fill="url(#panel)" stroke="#26364f"/>
    <rect x="120" y="168" width="1040" height="484" rx="22" fill="#07111f" opacity="0.52" stroke="#26364f"/>
  </g>

  <g opacity="0.36" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="6 10">
    <rect x="190" y="470" width="820" height="132" rx="24"/>
    <rect x="190" y="258" width="820" height="132" rx="24"/>
  </g>

  <g fill="none" stroke="url(#line)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
