      <rect x="1088" y="334" width="84" height="64" rx="14" fill="#0b1220" stroke="#6366f1" stroke-width="2"/>
      <rect x="1088" y="462" width="84" height="64" rx="14" fill="#0b1220" stroke="#6366f1" stroke-width="2"/>
      <path d="M1108 238h44M1108 366h44M1108 494h44" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="1106" cy="238" r="4" fill="#38bdf8"/><circle cx="1106" cy="366" r="4" fill="#38bdf8"/><circle cx="1106" cy="494" r="4" fill="#38bdf8"/>
    </g>
  </g>

  <g fill="#38bdf8">
    <circle cx="405" cy="244" r="6"/><circle cx="641" cy="244" r="6"/><circle cx="877" cy="244" r="6"/>
    <circle cx="265" cy="415" r="7"/><circle cx="505" cy="415" r="7"/><circle cx="745" cy="415" r="7"/><circle cx="985" cy="415" r="7"/>
